name: Generate Metrics Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ankitraj7727
          template: classic
          base: activity, community
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
